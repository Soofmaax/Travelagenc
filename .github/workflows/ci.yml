name: Quality & Security CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - '**'

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quality checks (lint, types, tests, format)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Prettier auto-fix
        run: npx prettier --write "src/**/*.{ts,tsx,css,json,md}"

      - name: Commit Prettier changes (PR only)
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format with Prettier"
          file_pattern: src/**/*.{ts,tsx,css,json,md}

      - name: Lint
        run: npm run lint

      - name: ESLint JSON report
        run: npx eslint src/ --format json --output-file eslint-report.json

      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

      - name: Prettier formatting check
        run: npx prettier --check "src/**/*.{ts,tsx,css,json,md}"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: Circular dependencies (madge)
        run: npx madge --circular src/ || (echo "❌ Circular dependencies detected" && exit 1)

      - name: Code duplication (jscpd)
        run: npx jscpd src/ --min-lines 10 --min-tokens 50 --reporters console

      - name: God files (cloc by file)
        run: npx cloc src/ --by-file --json --quiet | tee cloc-by-file.json

      - name: Upload cloc report
        uses: actions/upload-artifact@v4
        with:
          name: cloc-by-file
          path: cloc-by-file.json

      - name: Trufflehog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  build:
    name: Build app
    runs-on: ubuntu-latest
    needs: [checks, security, codeql]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Bundle size
        run: du -sh dist || true

      - name: Bundle size gate
        run: |
          SIZE=$(du -sb dist | cut -f1)
          THRESHOLD=5000000
          echo "Bundle size: $SIZE bytes"
          if [ "$SIZE" -gt "$THRESHOLD" ]; then
            echo "❌ Bundle size exceeds threshold ($THRESHOLD bytes)"
            exit 1
          fi

      - name: Bundle visualizer
        run: npx vite-bundle-visualizer

      - name: Upload bundle stats
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: stats.html
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [checks, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build app
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e