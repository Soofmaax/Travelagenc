name: Notify on CI Failure

on:
  workflow_run:
    workflows: [ "Quality & Security CI" ]
    types: [ completed ]

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Slack notify (optional)
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "CI failed for ${{ github.event.workflow_run.name }} on branch ${{ github.event.workflow_run.head_branch }}.\nRun: ${{ github.event.workflow_run.html_url }}\nCommit: ${{ github.event.workflow_run.head_sha }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Open issue (fallback)
        if: ${{ secrets.SLACK_WEBHOOK_URL == '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CI Failure: ${context.payload.workflow_run.name} (${context.payload.workflow_run.head_branch})`;
            const body = `CI failed.\n\nRun: ${context.payload.workflow_run.html_url}\nCommit: ${context.payload.workflow_run.head_sha}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ci', 'failure']
            });